plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yg.watervalve'
    compileSdk 35

    defaultConfig {
        applicationId "com.yg.watervalve"
        minSdk 26
        targetSdk 35
        versionCode 58
        versionName "0.11.8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

